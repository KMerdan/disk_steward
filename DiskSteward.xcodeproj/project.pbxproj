			shellScript = "set -eu\nhelpers_dir=\"${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers\"\nhelper=\"${helpers_dir}/disk-witness-mcp\"\nmkdir -p \"${helpers_dir}\"\ninstall -m 755 \"${BUILT_PRODUCTS_DIR}/disk-witness-mcp\" \"${helper}\"\ntest -x \"${helper}\"\n\nif [ \"${CODE_SIGNING_ALLOWED:-NO}\" = \"YES\" ] && [ -n \"${EXPANDED_CODE_SIGN_IDENTITY:-}\" ]; then\n  helper_entitlements=\"${CONFIGURATION_TEMP_DIR}/disk-witness-mcp.build/disk-witness-mcp.xcent\"\n  if [ ! -f \"${helper_entitlements}\" ]; then\n    echo \"error: MCP helper signing entitlements are missing: ${helper_entitlements}\" >&2\n    exit 1\n  fi\n\n  timestamp_argument=\"--timestamp=none\"\n  case \"${EXPANDED_CODE_SIGN_IDENTITY_NAME:-}\" in\n    \"Developer ID Application:\"*) timestamp_argument=\"--timestamp\" ;;\n  esac\n\n  /usr/bin/codesign \\\n    --force \\\n    --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" \\\n    --options runtime \\\n    \"${timestamp_argument}\" \\\n    --identifier com.marudankiji.disksteward.mcp \\\n    --entitlements \"${helper_entitlements}\" \\\n    \"${helper}\"\n\n  # Rebuild the universal container after codesign changes each slice's\n  # signature size. Without this normalization, both thin slices are\n  # valid but the fat binary fails verification on macOS 15.\n  /usr/bin/lipo \"${helper}\" -thin x86_64 -output \"${DERIVED_FILE_DIR}/disk-witness-mcp-x86_64\"\n  /usr/bin/lipo \"${helper}\" -thin arm64 -output \"${DERIVED_FILE_DIR}/disk-witness-mcp-arm64\"\n  /usr/bin/lipo -create \\\n    \"${DERIVED_FILE_DIR}/disk-witness-mcp-x86_64\" \\\n    \"${DERIVED_FILE_DIR}/disk-witness-mcp-arm64\" \\\n    -output \"${DERIVED_FILE_DIR}/disk-witness-mcp-universal\"\n  /usr/bin/install -m 755 \"${DERIVED_FILE_DIR}/disk-witness-mcp-universal\" \"${helper}\"\n  /usr/bin/codesign --verify --strict --verbose=2 \"${helper}\"\nfi\n";
