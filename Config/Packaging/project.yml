name: DiskSteward

options:
  bundleIdPrefix: com.marudankiji
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"

configs:
  Debug: debug
  Release: release
  CI: debug

packages:
  DiskStewardPackage:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEVELOPMENT_TEAM: G3P6TU385Y
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: Apple Development
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: Developer ID Application
      ENABLE_HARDENED_RUNTIME: YES
    CI:
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      DEVELOPMENT_TEAM: ""

targets:
  disk-witness-mcp:
    type: tool
    platform: macOS
    sources:
      - path: Sources/DiskStewardMCP
    dependencies:
      - package: DiskStewardPackage
        product: DiskStewardCore
    settings:
      base:
        PRODUCT_NAME: disk-witness-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.marudankiji.disksteward.mcp
        SKIP_INSTALL: YES
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: ""

  DiskSteward:
    type: application
    platform: macOS
    sources:
      - path: Sources/DiskStewardApp
      - path: Resources/App/Assets.xcassets
        buildPhase: resources
    info:
      path: Config/Packaging/DiskSteward-Info.plist
      properties:
        CFBundleDisplayName: Disk Steward
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: 1
        CFBundleIconName: AppIcon
        LSUIElement: true
        NSDesktopFolderUsageDescription: Disk Steward reads file metadata in folders you choose so it can explain storage growth. It never reads file contents.
        NSDocumentsFolderUsageDescription: Disk Steward reads file metadata in folders you choose so it can explain storage growth. It never reads file contents.
        NSDownloadsFolderUsageDescription: Disk Steward reads file metadata in folders you choose so it can explain storage growth. It never reads file contents.
        NSHumanReadableCopyright: Copyright © 2026 Marudan Kiji. All rights reserved.
    dependencies:
      - package: DiskStewardPackage
        product: DiskStewardCore
      - target: disk-witness-mcp
        embed: false
    settings:
      base:
        PRODUCT_NAME: Disk Steward
        PRODUCT_BUNDLE_IDENTIFIER: com.marudankiji.disksteward
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/DiskStewardApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Packaging/DiskSteward-Info.plist
        ENABLE_APP_SANDBOX: NO
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          PROVISIONING_PROFILE_SPECIFIER: Disk Steward Developer ID Distribution
    postBuildScripts:
      - name: Bundle read-only MCP helper
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          helpers_dir="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          mkdir -p "${helpers_dir}"
          install -m 755 "${BUILT_PRODUCTS_DIR}/disk-witness-mcp" "${helpers_dir}/disk-witness-mcp"
          test -x "${helpers_dir}/disk-witness-mcp"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/disk-witness-mcp

schemes:
  DiskSteward:
    shared: true
    build:
      targets:
        DiskSteward: all
        disk-witness-mcp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  DiskSteward-Release:
    shared: true
    build:
      targets:
        DiskSteward: all
        disk-witness-mcp: all
    run:
      config: Release
    test:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
